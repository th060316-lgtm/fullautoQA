<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Lantern Steps</title>
<style>*{box-sizing:border-box}body{background:#15233d;color:#f4edda;font:20px system-ui;margin:0;padding:4vh 6vw}h1,p{margin:8px 0}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:24px 0;height:36vh}.tile{border:2px solid #62718b;border-radius:14px;background:#243757;display:grid;place-items:center;font-size:40px}.active{background:#ffbb44;color:#102038}.goal{border-color:#70ddaa}button{font:inherit;padding:10px 22px;border:0;border-radius:10px;margin-right:12px}#feedback{min-height:2em;color:#70ddaa}small{font-size:14px}</style>
<h1>Lantern Steps</h1><p>Bring the lantern to the green gate. Use ← / → or the buttons. Press R to restart.</p><div class="board"></div><p id="status"></p><p id="feedback" role="status"></p><button id="left">← Left</button><button id="right">Right →</button><button id="reset">Restart</button><p><small>Independent supplementary acceptance game v1.0.0. No external assets.</small></p>
<script>
'use strict';let position=0,moves=0;function paint(message){const board=document.querySelector('.board');board.replaceChildren();for(let i=0;i<5;i++){const tile=document.createElement('div');tile.className='tile'+(i===position?' active':'')+(i===4?' goal':'');tile.textContent=i===position?'☀':i===4?'⚑':'·';board.append(tile)}document.querySelector('#status').textContent='Step '+(position+1)+' / 5 · Moves '+moves;document.querySelector('#feedback').textContent=position===4?'Gate reached! Restart to play again.':message||'Choose your next step.';console.log('lantern',JSON.stringify({position,moves,goal:position===4}))}function move(delta){if(position===4)return;position=Math.max(0,Math.min(4,position+delta));moves++;paint(delta>0?'The lantern moved right.':'The lantern moved left.')}function reset(){position=0;moves=0;paint('A fresh lantern journey.')}document.querySelector('#left').onclick=()=>move(-1);document.querySelector('#right').onclick=()=>move(1);document.querySelector('#reset').onclick=reset;document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','r','R'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);else reset()}});paint();
</script></html>
