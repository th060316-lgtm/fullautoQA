name: Local completion runner syntax

on:
  pull_request:
    branches: [main]
    paths:
      - 'RUN_LOCAL_COMPLETION.ps1'
      - '開発版/source/**'
      - '.github/workflows/local-completion-runner-syntax.yml'
  push:
    branches: [main]
    paths:
      - 'RUN_LOCAL_COMPLETION.ps1'
      - '開発版/source/**'
      - '.github/workflows/local-completion-runner-syntax.yml'

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RUN_LOCAL_COMPLETION.ps1
            RUN_LOCAL_COMPLETION.cmd
            開発版/source
          sparse-checkout-cone-mode: false
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |