name: Supplementary offline browser acceptance
on:
  push:
    branches: [work/issue1-browser-offline-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            開発版/source
            開発版/acceptance_targets/supplementary_browser_lantern
      - name: Explicit existing runtime and unit checks
        shell: pwsh
        run: |
          $candidates = @()
          foreach ($name in @('google-chrome','chromium','chrome')) {
            $command = Get-Command $name -ErrorAction SilentlyContinue
            if ($command) { $candidates += $command.Source }
          }
          if ($IsWindows) {
            foreach ($base in @($env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:LOCALAPPDATA)) {
              if ($base) { $candidates += Join-Path $base 'Google/Chrome/Application/chrome.exe' }
            }
          }
          $browser = @($candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -Unique)[0]
          if (-not $browser) { throw 'PREPROVISIONED_BROWSER_NOT_AVAILABLE_NO_DOWNLOAD' }
          "BROWSER_EXECUTABLE=$browser" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Path _browser_logs -Force | Out-Null
          Get-FileHash $browser -Algorithm SHA256 | ConvertTo-Json | Set-Content _browser_logs/runtime_file.json
          python -m unittest discover -s '開発版/source/TESTS' -p test_browser_cdp.py -v 2>&1 | Tee-Object _browser_logs/unit.log
          if ($LASTEXITCODE -ne 0) { throw 'BROWSER_UNIT_FAILED' }
          python -m unittest discover -s '開発版/source/TESTS' -p test_phase2_two_candidate_acceptance.py -v 2>&1 | Tee-Object _browser_logs/legacy.log
          if ($LASTEXITCODE -ne 0) { throw 'BROWSER_LEGACY_REGRESSION_FAILED' }
      - name: Actual file and loopback target, four agents, keyboard and pointer
        shell: pwsh
        run: |
          python '開発版/acceptance_targets/supplementary_browser_lantern/run_acceptance.py' --source-root '開発版/source' --browser "$env:BROWSER_EXECUTABLE" --out _browser_acceptance 2>&1 | Tee-Object _browser_logs/acceptance.log
          if ($LASTEXITCODE -ne 0) { throw 'SUPPLEMENTARY_BROWSER_ACCEPTANCE_FAILED' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplementary-browser-${{ matrix.os }}-${{ github.run_id }}
          path: |
            _browser_logs/**
            _browser_acceptance/**
          retention-days: 14
