name: Rollback predecessor qualification

on:
  push:
    branches: [main]
    paths:
      - '開発版/complete_v033/**'
      - '開発版/transfer/TRANSFER_MANIFEST.json'
      - '開発版/source/scripts/REPOSITORY_ENTRY.ps1'
      - '開発版/rollback/**'
      - '.gitattributes'
      - '.github/workflows/rollback-predecessor-qualification.yml'
  pull_request:
    branches: [main]
    paths:
      - '開発版/complete_v033/**'
      - '開発版/transfer/TRANSFER_MANIFEST.json'
      - '開発版/source/scripts/REPOSITORY_ENTRY.ps1'
      - '開発版/rollback/**'
      - '.gitattributes'
      - '.github/workflows/rollback-predecessor-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer commit on the same PR/ref supersedes the previous qualification
  # run.  Keeping SHA in the group left many obsolete 1 GB rebuild/selftest
  # jobs running concurrently and delayed the authoritative latest result.
  group: rollback-predecessor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-verified-predecessor:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            開発版/complete_v033
            開発版/rollback
            開発版/source/scripts
            開発版/acceptance_targets
            開発版/transfer/TRANSFER_MANIFEST.json
            開発版/transfer/FullAutoQA_Recovery_Source_20261102.zip
          sparse-checkout-cone-mode: false

      - name: The declared donor and predecessor snapshot must resolve
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $module = (Get-ChildItem -LiteralPath $PWD -Recurse -Filter 'REPOSITORY_ENTRY.ps1' | Select-Object -First 1).FullName
          if (-not $module) { throw 'REPOSITORY_ENTRY_MODULE_NOT_FOUND' }
          . $module
          $sourceRoot = Get-RepositorySourceRoot
          $entries = Get-DeclaredRepositoryEntries -RepositoryRoot $PWD -SourceRoot $sourceRoot
          $problems = Test-DeclaredRepositoryEntries -Entries $entries
          if ($problems.Count -ne 0) { throw ('DECLARED_ENTRIES_INVALID:' + ($problems -join ',')) }
          $expected = (Get-ChildItem -LiteralPath $PWD -Directory | Where-Object {
            Test-Path -LiteralPath (Join-Path $_.FullName 'complete_v033/manifest.json') -PathType Leaf
          } | Select-Object -First 1)
          if (-not $expected) { throw 'COMPLETE_V033_NOT_FOUND' }
          if ([IO.Path]::GetFullPath($entries.donor_root) -ne [IO.Path]::GetFullPath((Join-Path $expected.FullName 'complete_v033'))) {
            throw ('DECLARED_DONOR_ROOT_DIVERGES:' + $entries.donor_root)
          }
          $snapshot=Join-Path $expected.FullName 'rollback/predecessor_23e0f380/manifest.json'
          if (-not (Test-Path -LiteralPath $snapshot -PathType Leaf)) { throw 'PREDECESSOR_SNAPSHOT_MANIFEST_MISSING' }
          $snapshotDoc=Get-Content -LiteralPath $snapshot -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $snapshotDoc.predecessor.source_commit) { throw 'PREDECESSOR_SNAPSHOT_SOURCE_COMMIT_MISSING' }
          Write-Host ('DECLARED_DONOR_RESOLVES ' + $entries.donor_root)
          Write-Host ('PREDECESSOR_SNAPSHOT_RESOLVES ' + $snapshotDoc.predecessor.source_commit)

      - name: Execute the exact rollback entrypoint on a fresh destination
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script=(Resolve-Path './開発版/rollback/RESTORE_PREDECESSOR.ps1').Path
          $destination=Join-Path $PWD '_rollback_fresh'
          $evidence=Join-Path $PWD '_rollback_evidence'
          # The REAL-MACHINE argument shape: no -PredecessorSet.  The
          # predecessor is resolved from TRANSFER_MANIFEST.json through the
          # shared entry contract, exactly as the local completion route
          # invokes it.  CI used to pass -PredecessorSet, which bypassed the
          # manifest branch and therefore never tested the code path the
          # machine actually runs.
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File $script -RepositoryRoot $PWD -Destination $destination -EvidenceDirectory $evidence -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "ROLLBACK_ENTRYPOINT_FAILED:$LASTEXITCODE" }
          $proof=Get-Content -LiteralPath (Join-Path $evidence 'ROLLBACK_PREDECESSOR_QUALIFICATION.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($proof.snapshot_git_blob_identity -ne 'PASS') { throw 'ROLLBACK_SNAPSHOT_IDENTITY_NOT_PASS' }
          if ($proof.donor_byte_identity -ne 'PASS') { throw 'ROLLBACK_DONOR_BYTE_IDENTITY_NOT_PASS' }
          if ($proof.package_integrity -ne 'PASS') { throw 'ROLLBACK_PACKAGE_INTEGRITY_NOT_PASS' }
          if ($proof.runnable_rollback_status -ne 'PASS') { throw 'ROLLBACK_RUNNABLE_NOT_PASS' }
          if (@('PASS','NOT_IDENTICAL_REBUILD') -notcontains [string]$proof.historical_candidate_byte_identity) {
            throw 'ROLLBACK_HISTORICAL_BYTE_IDENTITY_UNREPORTED'
          }
          if ($proof.product_acceptance -ne 'NOT_CLAIMED' -or $proof.stable_certification -ne 'NOT_CLAIMED') { throw 'ROLLBACK_SCOPE_OVERCLAIM' }
          Write-Host "ROLLBACK_QUALIFICATION_PASS source=$($proof.predecessor_source_commit) rebuilt_sha256=$($proof.rebuilt_candidate_sha256) historical_byte_identity=$($proof.historical_candidate_byte_identity)"

      - name: Upload rollback qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rollback-Predecessor-Qualification-${{ github.run_id }}-Attempt-${{ github.run_attempt }}
          path: _rollback_evidence/**
          retention-days: 90
