name: Frozen target A compatibility preflight
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '開発版/source/CORE/**'
      - '開発版/source/scripts/PREPARE_SOURCE.ps1'
      - '開発版/transfer/FullAutoQA_Recovery_Source_20261102.zip'
      - '開発版/transfer/TRANSFER_MANIFEST.json'
      - '開発版/acceptance_targets/politicstrasport/**'
      - '開発版/complete_v033/**'
      - '.github/workflows/target-a-preflight.yml'
      - '.gitattributes'
permissions:
  contents: read
  actions: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            if(context.eventName!=='pull_request'||context.payload.action!=='synchronize'||!context.payload.before) { core.setOutput('changed','true'); return; }
            const {owner,repo}=context.repo;
            const a=(await github.rest.git.getTree({owner,repo,tree_sha:context.payload.before,recursive:'1'})).data;
            const b=(await github.rest.git.getTree({owner,repo,tree_sha:context.payload.pull_request.head.sha,recursive:'1'})).data;
            if(a.truncated||b.truncated) throw new Error('PREFLIGHT_INPUT_TREE_TRUNCATED');
            const paths=new Set(['.gitattributes','開発版/source/CORE','開発版/source/scripts','開発版/source/BOOTSTRAP.ps1','開発版/source/START_QA.cmd','開発版/transfer/FullAutoQA_Recovery_Source_20261102.zip','開発版/transfer/TRANSFER_MANIFEST.json','開発版/acceptance_targets/politicstrasport','開発版/acceptance_targets/run_target.py','開発版/complete_v033']);
            const select=t=>JSON.stringify(t.tree.filter(x=>paths.has(x.path)).map(x=>[x.path,x.sha]).sort());
            core.setOutput('changed',String(select(a)!==select(b)));
  preflight:
    needs: inputs
    if: needs.inputs.outputs.changed == 'true' 
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            開発版/complete_v033
            開発版/source
            開発版/transfer/FullAutoQA_Recovery_Source_20261102.zip
            開発版/transfer/TRANSFER_MANIFEST.json
            開発版/acceptance_targets
          sparse-checkout-cone-mode: false
      - name: Rebuild current Candidate from preserved donor and current Source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $prepare=(Resolve-Path './開発版/source/scripts/PREPARE_SOURCE.ps1').Path
          $prepared=& "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File $prepare -RepositoryRoot $PWD -Destination (Join-Path $PWD '_source')
          if($LASTEXITCODE -ne 0){throw "PREPARE_SOURCE_FAILED:$LASTEXITCODE"}
          $source=([string](@($prepared|Where-Object{$_.Trim()})[-1])).Trim()
          if(-not (Test-Path -LiteralPath (Join-Path $source 'CORE') -PathType Container)){throw 'PREPARED_SOURCE_INVALID'}
          Copy-Item -LiteralPath './開発版/acceptance_targets' -Destination (Join-Path $source 'ACCEPTANCE') -Recurse -Force

          $fingerprintScript=Join-Path $source 'scripts/SOURCE_TREE_FINGERPRINT.ps1'
          $fpOut=& "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File $fingerprintScript -Root $source
          if($LASTEXITCODE -ne 0){throw "SOURCE_FINGERPRINT_FAILED:$LASTEXITCODE"}
          $fingerprint=([string](@($fpOut|Where-Object{$_.Trim()})[-1])).Trim().ToLowerInvariant()
          if($fingerprint -notmatch '^[0-9a-f]{64}$'){throw "SOURCE_FINGERPRINT_INVALID:$fingerprint"}

          $complete=(Resolve-Path './開発版/complete_v033').Path
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $complete 'JOIN_COMPLETE.ps1')
          if($LASTEXITCODE -ne 0){throw "DONOR_JOIN_FAILED:$LASTEXITCODE"}
          $manifest=Get-Content -LiteralPath (Join-Path $complete 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $donor=Join-Path $complete ([string]$manifest.file)
          if(-not (Test-Path -LiteralPath $donor -PathType Leaf)){throw 'DONOR_ARCHIVE_MISSING'}
          if((Get-Item -LiteralPath $donor).Length -ne [long]$manifest.size){throw 'DONOR_SIZE_MISMATCH'}
          if((Get-FileHash -LiteralPath $donor -Algorithm SHA256).Hash.ToLowerInvariant() -ne ([string]$manifest.sha256).ToLowerInvariant()){throw 'DONOR_SHA_MISMATCH'}

          $build=Join-Path $PWD '_target_preflight_build'
          New-Item -ItemType Directory -Path $build -Force | Out-Null
          $builder=Join-Path $source 'scripts/PHASE3_OVERLAY_REBUILD.ps1'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File $builder -DonorArchive $donor -SourceRoot $source -OutputDir $build -SourceBaseline $fingerprint 2>&1 | Tee-Object -FilePath (Join-Path $build 'TARGET_A_CANDIDATE_BUILD.log')
          if($LASTEXITCODE -ne 0){throw "CANDIDATE_BUILD_FAILED:$LASTEXITCODE"}
          $zip=Join-Path $build 'FullAutoQA_PHASE3_CANDIDATE.zip'
          $identity=Join-Path $build 'PHASE3_CANDIDATE_IDENTITY.json'
          if(-not (Test-Path -LiteralPath $zip -PathType Leaf) -or -not (Test-Path -LiteralPath $identity -PathType Leaf)){throw 'CANDIDATE_OUTPUT_MISSING'}
          $id=Get-Content -LiteralPath $identity -Raw -Encoding UTF8 | ConvertFrom-Json
          if((Get-Item -LiteralPath $zip).Length -ne [long]$id.candidate_size){throw 'CANDIDATE_SIZE_RECORD_MISMATCH'}
          if((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne ([string]$id.candidate_sha256).ToLowerInvariant()){throw 'CANDIDATE_SHA_RECORD_MISMATCH'}

          $fresh=Join-Path $PWD '_target_preflight'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$fresh)
          $python=Join-Path $fresh 'RUNTIME/python/python.exe'
          & $python -B -E -s (Join-Path $fresh 'scripts/package_integrity.py') --root $fresh --full-payload --require-fresh-marker
          if($LASTEXITCODE -ne 0){throw 'CURRENT_CANDIDATE_INVALID'}
          & $python -B -E -s (Join-Path $fresh 'ACCEPTANCE/politicstrasport/prepare_target.py') --candidate-root $fresh
          if($LASTEXITCODE -ne 0){throw 'FROZEN_TARGET_PREPARATION_FAILED'}
          "FRESH_ROOT=$fresh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BUNDLED_PYTHON=$python" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: START_QA target compatibility diagnostic, not Final Run 1
        shell: pwsh
        run: |
          & "$env:BUNDLED_PYTHON" -B -E -s (Join-Path $env:FRESH_ROOT 'ACCEPTANCE/run_target.py') --candidate-root $env:FRESH_ROOT --evidence (Join-Path $PWD '_target_preflight_evidence')
          if ($LASTEXITCODE -ne 0) { throw "TARGET_PREFLIGHT_NONPASS:$LASTEXITCODE" }
      - name: Complete Source regression using actual bundled FFmpeg
        if: always() && env.BUNDLED_PYTHON != ''
        shell: pwsh
        run: |
          $ffmpeg=@(Get-ChildItem (Join-Path $env:FRESH_ROOT 'RUNTIME') -Recurse -Filter ffmpeg.exe)
          $dirs=@($ffmpeg | ForEach-Object { $_.DirectoryName } | Select-Object -Unique)
          if ($dirs.Count -eq 0) { throw 'BUNDLED_ENCODER_NOT_PREPARED' }
          $env:PATH=($dirs -join ';')+';'+$env:PATH
          & "$env:BUNDLED_PYTHON" -B -E -s -m unittest discover -s (Join-Path $env:FRESH_ROOT 'TESTS') -v 2>&1 | Tee-Object BUNDLED_SOURCE_TESTS.log
          if ($LASTEXITCODE -ne 0) { throw 'BUNDLED_SOURCE_TESTS_FAILED' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Target-A-Preflight-${{ github.run_id }}
          path: |
            _target_preflight_evidence/**
            _target_preflight/RESULTS/**
            _target_preflight/TARGET_PREPARATION.json
            _target_preflight_build/PHASE3_CANDIDATE_IDENTITY.json
            _target_preflight_build/PHASE3_CANDIDATE_BUILD_REPORT.json
            _target_preflight_build/TARGET_A_CANDIDATE_BUILD.log
            BUNDLED_SOURCE_TESTS.log
          retention-days: 14

