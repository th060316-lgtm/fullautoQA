name: Source overlay Windows selftest
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '開発版/source/**'
      - '開発版/transfer/FullAutoQA_Recovery_Source_20261102.zip'
      - '開発版/transfer/TRANSFER_MANIFEST.json'
      - '.github/workflows/source-overlay-selftest.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: source-overlay-selftest-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            if(context.eventName!=='pull_request'||context.payload.action!=='synchronize'||!context.payload.before) { core.setOutput('changed','true'); return; }
            const {owner,repo}=context.repo;
            const before=(await github.rest.git.getTree({owner,repo,tree_sha:context.payload.before,recursive:'1'})).data;
            const after=(await github.rest.git.getTree({owner,repo,tree_sha:context.payload.pull_request.head.sha,recursive:'1'})).data;
            if(before.truncated||after.truncated) throw new Error('SOURCE_TREE_TRUNCATED');
            const select=t=>JSON.stringify(t.tree.filter(x=>x.path==='開発版/source' || x.path==='開発版/transfer/FullAutoQA_Recovery_Source_20261102.zip' || x.path==='開発版/transfer/TRANSFER_MANIFEST.json').map(x=>[x.path,x.sha]).sort());
            const changed=select(before)!==select(after);
            core.setOutput('changed',String(changed));
            if(changed) {
              const branch=context.payload.pull_request.head.ref;
              const runs=(await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'source-overlay-selftest.yml',branch,per_page:30})).data.workflow_runs;
              for(const run of runs) if(run.id!==context.runId&&run.head_sha!==context.payload.pull_request.head.sha&&run.status!=='completed') {
                try { await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:run.id}); } catch(error) { if(![404,409].includes(error.status)) throw error; }
                core.info('Cancelled superseded Source overlay '+run.id+'; always evidence steps remain enabled');
              }
            }
  diagnostic:
    needs: inputs
    if: needs.inputs.outputs.changed == 'true' 
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            開発版/source
            開発版/transfer/FullAutoQA_Recovery_Source_20261102.zip
            開発版/transfer/TRANSFER_MANIFEST.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41636608324
          name: FullAutoQA-Phase3-Candidate-93cc5ce54d30a9abca6d886ce451bc6b578fc468
          path: _old_candidate
      - name: Reconstruct complete current Source
        shell: pwsh
        run: |
          $source = & './開発版/source/scripts/PREPARE_SOURCE.ps1' -RepositoryRoot $PWD -Destination (Join-Path $PWD '_source')
          "SOURCE_ROOT=$source" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Create diagnostic overlay without rebuilding a Candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $PWD '_old_candidate/FullAutoQA_PHASE3_CANDIDATE.zip'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6b2190c79a14f55ef17b4ba1be14e98567a2fa4ade67a1a5d7758c5f59b46b1d') { throw 'DONOR_CANDIDATE_IDENTITY' }
          $fresh=Join-Path $PWD '_diagnostic'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$fresh)
          $python=Join-Path $fresh 'RUNTIME/python/python.exe'
          & $python -B -E -s (Join-Path $fresh 'scripts/package_integrity.py') --root $fresh --full-payload --require-fresh-marker
          if ($LASTEXITCODE -ne 0) { throw 'PRISTINE_PACKAGE_INVALID' }
          Get-ChildItem $env:SOURCE_ROOT -Force | Where-Object { $_.Name -notin @('RUNTIME','PAYLOAD','RESULTS','core_manifest.json','package_manifest.json') } | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $fresh -Force -Recurse }
          & (Join-Path $fresh 'scripts/PHASE3_REGEN_MANIFEST.ps1') -Tree $fresh
          if ($LASTEXITCODE -ne 0) { throw 'CORE_MANIFEST_FAILED' }
          "FRESH_ROOT=$fresh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          '{"scope":"SOURCE_OVERLAY_DIAGNOSTIC_NOT_FINAL_CANDIDATE","old_candidate_sha256":"6b2190c79a14f55ef17b4ba1be14e98567a2fa4ade67a1a5d7758c5f59b46b1d"}' | Set-Content DIAGNOSTIC_SCOPE.json
      - name: Native fixture normal and fault isolation regression
        shell: pwsh
        run: |
          & (Join-Path $env:FRESH_ROOT 'RUNTIME/python/python.exe') -B -E -s (Join-Path $env:FRESH_ROOT 'TESTS/probe_native_fixture_faults.py') --root $env:FRESH_ROOT --evidence (Join-Path $PWD '_native_fixture_regression')
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_FIXTURE_FAULT_REGRESSION_FAILED' }
      - name: START_QA full selftest
        shell: pwsh
        run: |
          Push-Location $env:FRESH_ROOT
          try { & cmd.exe /d /c 'START_QA.cmd -SelfTest' 2>&1 | Tee-Object (Join-Path $env:GITHUB_WORKSPACE 'SELFTEST.log'); $code=$LASTEXITCODE } finally { Pop-Location }
          "$code" | Set-Content SELFTEST_EXIT.txt
          if ($code -ne 0) { throw "SELFTEST_REQUIRED_NONPASS:$code" }
      - name: Complete Source suite with bundled Python and FFmpeg
        if: always() && env.FRESH_ROOT != ''
        shell: pwsh
        run: |
          $ffmpeg=@(Get-ChildItem (Join-Path $env:FRESH_ROOT 'RUNTIME') -Recurse -Filter ffmpeg.exe)
          $dirs=@($ffmpeg | ForEach-Object { $_.DirectoryName } | Select-Object -Unique)
          if ($dirs.Count -eq 0) { throw 'BUNDLED_ENCODER_NOT_PREPARED' }
          $env:PATH=($dirs -join ';')+';'+$env:PATH
          & (Join-Path $env:FRESH_ROOT 'RUNTIME/python/python.exe') -B -E -s -m unittest discover -s (Join-Path $env:FRESH_ROOT 'TESTS') -v 2>&1 | Tee-Object BUNDLED_SOURCE_TESTS.log
          if ($LASTEXITCODE -ne 0) { throw 'BUNDLED_SOURCE_TESTS_FAILED' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Source-Overlay-Selftest-${{ github.run_id }}
          path: |
            _native_fixture_regression/**
            DIAGNOSTIC_SCOPE.json
            BUNDLED_SOURCE_TESTS.log
            SELFTEST*.*
            _diagnostic/RESULTS/**
          retention-days: 14

