name: Local completion runner syntax

on:
  pull_request:
    branches: [main]
    paths:
      - 'RUN_LOCAL_COMPLETION.ps1'
      - '開発版/source/**'
      - '開発版/rollback/**'
      - '.github/workflows/local-completion-runner-syntax.yml'
  push:
    branches: [main]
    paths:
      - 'RUN_LOCAL_COMPLETION.ps1'
      - '開発版/source/**'
      - '開発版/rollback/**'
      - '.github/workflows/local-completion-runner-syntax.yml'

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RUN_LOCAL_COMPLETION.ps1
            RUN_LOCAL_COMPLETION.cmd
            開発版/source
            開発版/rollback
            開発版/transfer/TRANSFER_MANIFEST.json
          sparse-checkout-cone-mode: false
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'RUN_LOCAL_COMPLETION.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){ throw ($errors | Out-String) }
          Write-Host 'RUN_LOCAL_COMPLETION.ps1 parse PASS'
      - name: Parse every executable repository PowerShell script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $snapshotSegment=[IO.Path]::Combine('rollback','predecessor_23e0f380','snapshot')
          $scripts=@(Get-ChildItem -LiteralPath $PWD -Recurse -File -Filter '*.ps1' | Where-Object {
            $_.FullName.IndexOf($snapshotSegment,[StringComparison]::OrdinalIgnoreCase) -lt 0
          })
          if($scripts.Count -eq 0){throw 'NO_POWERSHELL_SCRIPTS_FOUND'}
          $allErrors=New-Object 'System.Collections.Generic.List[string]'
          foreach($script in $scripts){
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            foreach($error in @($errors)){
              $allErrors.Add(($script.FullName+':'+$error.Extent.StartLineNumber+':'+$error.Message))
            }
          }
          if($allErrors.Count){throw ($allErrors -join [Environment]::NewLine)}
          Write-Host ('POWERSHELL51_PARSE_ALL_PASS count='+$scripts.Count)

      - name: Run native-process contract test on Windows PowerShell 5.1
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $PWD 'RUN_LOCAL_COMPLETION.ps1') -NativeProcessContractTest
          if($LASTEXITCODE -ne 0){ throw ('NATIVE_PROCESS_CONTRACT_TEST_FAILED:'+$LASTEXITCODE) }
      - name: Run stable evidence-export contract test on Windows PowerShell 5.1
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $PWD 'RUN_LOCAL_COMPLETION.ps1') -EvidenceExportContractTest
          if($LASTEXITCODE -ne 0){ throw ('EVIDENCE_EXPORT_CONTRACT_TEST_FAILED:'+$LASTEXITCODE) }
      - name: Run repository-discovery contract test on Windows PowerShell 5.1
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $PWD 'RUN_LOCAL_COMPLETION.ps1') -RepositoryDiscoveryContractTest
          if($LASTEXITCODE -ne 0){ throw ('REPOSITORY_DISCOVERY_CONTRACT_TEST_FAILED:'+$LASTEXITCODE) }
      - name: Every shipped script must be ASCII-only or UTF-8 with BOM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $test=(Get-ChildItem -LiteralPath $PWD -Recurse -Filter 'test_windows_script_encoding.py' | Select-Object -First 1).FullName
          if (-not $test) { throw 'WINDOWS_SCRIPT_ENCODING_TEST_NOT_FOUND' }
          python $test -v
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_SCRIPT_ENCODING_CONTRACT_FAILED:$LASTEXITCODE" }
      - name: The runner must resolve its inputs through the shared entry contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $test=(Get-ChildItem -LiteralPath $PWD -Recurse -Filter 'test_local_completion_runner_contract.py' | Select-Object -First 1).FullName
          if (-not $test) { throw 'LOCAL_COMPLETION_RUNNER_CONTRACT_TEST_NOT_FOUND' }
          python $test -v
          if ($LASTEXITCODE -ne 0) { throw "LOCAL_COMPLETION_RUNNER_CONTRACT_FAILED:$LASTEXITCODE" }
