name: Phase 2 Source Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: source-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            開発版/source
            開発版/acceptance_targets
            開発版/transfer/FullAutoQA_Recovery_Source_20261102.zip
            開発版/transfer/TRANSFER_MANIFEST.json
          sparse-checkout-cone-mode: false

      - name: Reconstruct complete source test substrate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceRoot = & "./開発版/source/scripts/PREPARE_SOURCE.ps1" -RepositoryRoot $PWD -Destination (Join-Path $PWD "_recovery")
          "SOURCE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACCEPTANCE_ROOT=$((Resolve-Path './開発版/acceptance_targets').Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Snapshot reconstructed Source before regression
        shell: pwsh
        run: |
          python -B "$env:SOURCE_ROOT/scripts/source_tree_immutability.py" snapshot --root "$env:SOURCE_ROOT" --output "$env:GITHUB_WORKSPACE/SOURCE_TREE_BEFORE.json"
          if ($LASTEXITCODE -ne 0) { throw "SOURCE_TREE_SNAPSHOT_FAILED:$LASTEXITCODE" }

      - name: Compile reconstructed Python source
        shell: pwsh
        run: python -m compileall -q "$env:SOURCE_ROOT/CORE" "$env:SOURCE_ROOT/TESTS"

      - name: Run reconstructed source unit tests
        shell: pwsh
        run: python -m unittest discover -s "$env:SOURCE_ROOT/TESTS" -v


      - name: Verify Source regression did not mutate its input
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath "$env:SOURCE_ROOT" -Directory -Recurse -Filter '__pycache__' | Remove-Item -Recurse -Force
          python -B "$env:SOURCE_ROOT/scripts/source_tree_immutability.py" compare --root "$env:SOURCE_ROOT" --before "$env:GITHUB_WORKSPACE/SOURCE_TREE_BEFORE.json" --output "$env:GITHUB_WORKSPACE/SOURCE_TREE_MUTATION.json"
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath "$env:GITHUB_WORKSPACE/SOURCE_TREE_MUTATION.json"
            throw "SOURCE_REGRESSION_MUTATED_INPUT"
          }

      - name: Upload Source immutability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Source-Immutability-${{ runner.os }}-${{ github.run_id }}-Attempt-${{ github.run_attempt }}
          path: |
            SOURCE_TREE_BEFORE.json
            SOURCE_TREE_MUTATION.json
          if-no-files-found: warn
          retention-days: 14

      - name: Parse Windows PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          @(Get-ChildItem -LiteralPath "$env:SOURCE_ROOT" -Recurse -Filter *.ps1) + @(Get-ChildItem -LiteralPath $env:ACCEPTANCE_ROOT -Recurse -Filter *.ps1) | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($_.FullName + ": " + ($parseErrors | Out-String)) }
          }


      - name: Acceptance helper integrity tests
        shell: pwsh
        run: |
          Get-ChildItem './開発版/acceptance_targets' -Filter 'test*.py' -Recurse | ForEach-Object {
            python -B $_.FullName -v
            if ($LASTEXITCODE -ne 0) { throw ('ACCEPTANCE_HELPER_TEST_FAILED:' + $_.FullName) }
          }
